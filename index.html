<!DOCTYPE html><html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Alvarez-Consult</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#05050d}
canvas{display:block}
@import url('https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600&display=swap');
#ui{position:fixed;inset:0;z-index:2;pointer-events:none;display:flex;align-items:center;justify-content:center;font-family:'Inter',system-ui,sans-serif;color:#e4e4ec}
#ui h1{font-size:clamp(2rem,6vw,4.5rem);font-weight:300;text-align:center;letter-spacing:-0.02em;line-height:1.1;text-shadow:0 0 60px rgba(5,5,13,0.9)}
#ui .grad{background:linear-gradient(120deg,#a78bfa,#06b6d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
#ui p{font-size:0.95rem;color:#71717a;margin-top:1.5rem}
.bg-grid{position:fixed;inset:0;z-index:0;opacity:0.025;background-image:linear-gradient(rgba(139,92,246,0.2) 1px,transparent 1px),linear-gradient(90deg,rgba(139,92,246,0.2) 1px,transparent 1px);background-size:80px 80px}
.grain{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0.02;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/%3E%3C/svg%3E");background-size:256px 256px}
.header{position:fixed;top:0;left:0;right:0;z-index:100;padding:1.5rem 2.5rem;display:flex;justify-content:space-between;align-items:center}
.wordmark{font-size:1rem;font-weight:600;letter-spacing:0.04em;color:#a78bfa}
.header-cta{font-size:0.8rem;color:#a1a1aa;text-decoration:none;letter-spacing:0.06em;text-transform:uppercase;transition:color 0.3s;pointer-events:auto}
.header-cta:hover{color:#a78bfa}
.footer{position:fixed;bottom:0;left:0;right:0;z-index:100;padding:1.5rem 2.5rem;display:flex;justify-content:space-between;align-items:center;font-size:0.7rem;color:#52525b;letter-spacing:0.06em}
</style>
</head><body>
<div class="bg-grid"></div><div class="grain"></div>
<canvas id="c"></canvas>

<div id="ui"><div>
  <h1>We build<br><span class="grad">intelligence</span><br>into systems.</h1>
  <p style="text-align:center">Custom AI Solutions</p>
</div></div>

<header class="header"><div class="wordmark">AlvarezConsult</div><a href="mailto:hello@alvarezconsult.com" class="header-cta">Contact</a></header>
<footer class="footer"><span>© 2026 Alvarez-Consult</span><span>Sevilla · Madrid</span></footer>

<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';

const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('c'),alpha:true,antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(45,window.innerWidth/window.innerHeight,0.1,1000);
camera.position.set(0,0,10);

scene.add(new THREE.AmbientLight(0xffffff,2));
scene.add(new THREE.DirectionalLight(0xffffff,2)).position.set(1,1,1);

// Test cube - pink, rotating
const cube=new THREE.Mesh(new THREE.BoxGeometry(2,2,2),new THREE.MeshStandardMaterial({color:0xff00ff}));
scene.add(cube);

// Load model
const loader=new GLTFLoader();
let models=[],mixers=[];

loader.load('models/human.glb',function(gltf){
  console.log('Model loaded:',gltf.animations.length,'anims');

  for(let i=0;i<5;i++){
    // Re-load for each instance (clone doesn't work well with skeletons)
    loader.load('models/human.glb',function(g){
      const model=g.scene;
      model.traverse(function(c){
        if(c.isMesh&&c.material){
          const mats=Array.isArray(c.material)?c.material:[c.material];
          const colors=[0xff5588,0x55aaff,0x55dd55,0xffee44,0xff88ff];
          for(let j=0;j<mats.length;j++){
            mats[j].color=new THREE.Color(colors[i]);
            mats[j].emissive=new THREE.Color(colors[i]).multiplyScalar(0.3);
            mats[j].needsUpdate=true;
          }
        }
      });

      const box=new THREE.Box3().setFromObject(model);
      const h=box.max.y-box.min.y;
      model.scale.setScalar(4/h);

      const angle=(i/5)*Math.PI*2;
      model.position.set(Math.cos(angle)*5,-1.5,Math.sin(angle)*4-2);
      model.rotation.set(0,angle+Math.PI/2,0);
      scene.add(model);
      models.push(model);

      const mixer=new THREE.AnimationMixer(model);
      if(g.animations.length)mixer.clipAction(g.animations[0]).play();
      mixers.push(mixer);
    });
  }
});

const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.1);
  cube.rotation.y+=dt*0.5;cube.rotation.x+=dt*0.3;
  for(let i=0;i<mixers.length;i++)mixers[i].update(dt);
  for(let i=0;i<models.length;i++){
    models[i].rotation.y+=dt*0.2;
    models[i].position.y=-1.5+Math.sin(Date.now()*0.002+i)*0.3;
  }
  renderer.render(scene,camera);
}
requestAnimationFrame(animate);
window.addEventListener('resize',function(){
  renderer.setSize(window.innerWidth,window.innerHeight);
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
});
</script>
</body></html>
