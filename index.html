<!DOCTYPE html><html><body style="margin:0;background:#111">
<canvas id="c" style="display:block"></canvas>
<div id="log" style="position:fixed;top:10px;left:10px;color:#0f0;font:14px monospace;z-index:9">...</div>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const L=document.getElementById('log');

const r=new THREE.WebGLRenderer({canvas:document.getElementById('c'),alpha:true});
r.setSize(window.innerWidth,window.innerHeight);
r.outputColorSpace=THREE.SRGBColorSpace;

const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(45,window.innerWidth/window.innerHeight,0.1,100);
cam.position.set(0,0,10);cam.lookAt(0,0,0);

// Use BasicMaterial - ignores lights, always shows color
const cube=new THREE.Mesh(new THREE.BoxGeometry(2,2,2),new THREE.MeshBasicMaterial({color:0xff00ff}));
cube.position.set(-3,0,0);scene.add(cube);

const sphere=new THREE.Mesh(new THREE.SphereGeometry(1,16,16),new THREE.MeshBasicMaterial({color:0x00ff00}));
sphere.position.set(3,0,0);scene.add(sphere);

L.textContent='Loading...';

new GLTFLoader().load('models/human.glb',function(gltf){
  const model=gltf.scene;
  model.traverse(function(c){
    if(c.isMesh&&c.material){
      const mats=Array.isArray(c.material)?c.material:[c.material];
      for(let j=0;j<mats.length;j++){
        // Convert to BasicMaterial (no lighting needed)
        const col=mats[j].color||new THREE.Color(0xff8800);
        const newMat=new THREE.MeshBasicMaterial({color:col});
        if(mats[j].map)newMat.map=mats[j].map;
        mats[j]=newMat;
      }
      c.material=Array.isArray(c.material)?mats:mats[0];
    }
  });
  const box=new THREE.Box3().setFromObject(model);
  const h=box.max.y-box.min.y;
  model.scale.setScalar(4/h);
  model.position.set(0,0,0);
  scene.add(model);
  L.textContent='Model at center | BasicMaterial | scale:'+model.scale.x.toFixed(1);
  if(gltf.animations.length){
    const mixer=new THREE.AnimationMixer(model);
    mixer.clipAction(gltf.animations[0]).play();
    const clock=new THREE.Clock();
    function anim(){requestAnimationFrame(anim);mixer.update(Math.min(clock.getDelta(),0.1));cube.rotation.y+=0.01;r.render(scene,cam)}
    anim();
  }
},function(xhr){if(xhr.total)L.textContent='Loading: '+Math.round(xhr.loaded/xhr.total*100)+'%'},function(err){L.textContent='ERROR: '+err});
</script>
</body></html>
